[platformio]

[env:cyd]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  adafruit/Adafruit BNO055@1.6.4
  adafruit/Adafruit GFX Library@1.11.11
  bblanchon/ArduinoJson@6.21.3
  bodmer/TJpg_Decoder
; XPT2046_Touchscreen is bundled in lib/; no Git client is required.
build_flags =
  -D USER_SETUP_LOADED
  -D USE_HSPI_PORT
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_GFXFF
  -D SPI_FREQUENCY=40000000
